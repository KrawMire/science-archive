<header class="admin-header">
  <div class="sa-container admin-header__row">
    <a routerLink="/admin" class="admin-header__logo" aria-label="Science Archive">
      <sar-logo class="sar-logo--light" [tile]="true" />
      <span class="admin-header__badge">{{ 'admin.badge' | nzI18n }}</span>
    </a>
    <nav class="admin-header__nav">
      <a routerLink="articles" routerLinkActive="is-active">
        {{ 'header.articles' | nzI18n }}
        <span class="admin-header__count" *ngIf="(pendingCount$ | async) as count">{{ count }}</span>
      </a>
      <a routerLink="news" routerLinkActive="is-active">{{ 'header.news' | nzI18n }}</a>
    </nav>
    <a routerLink="/" class="admin-header__back">
      <sar-icon name="arrow-left" [size]="14" />
      <span>{{ 'admin.backToArchive' | nzI18n }}</span>
    </a>
  </div>
</header>

<main class="sa-page-body">
  <div class="sa-container">
    <router-outlet />
  </div>
</main>
