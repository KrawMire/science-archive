<section class="sa-card shelf">
  <div class="shelf__intro">
    <h2 class="shelf__name">
      <a routerLink="/content/articles" [queryParams]="{ fieldId: category.id }">{{ category.name }}</a>
    </h2>
    <p class="shelf__description" *ngIf="category.description">{{ category.description }}</p>
  </div>
  <div class="shelf__subjects">
    <sar-subcategory-card *ngFor="let subcategory of category.subcategories" [subcategory]="subcategory" />
  </div>
</section>
