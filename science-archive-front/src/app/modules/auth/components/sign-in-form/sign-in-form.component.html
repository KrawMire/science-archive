<form nz-form nzLayout="vertical" class="sa-form" [formGroup]="validateForm" (ngSubmit)="submitForm()">
  <h2 class="sa-form__title">{{ 'auth.welcomeBack' | nzI18n }}</h2>
  <p class="sa-form__lead">{{ 'auth.signInLead' | nzI18n }}</p>

  <nz-form-item>
    <nz-form-label nzFor="sign-in-login">{{ 'authPage.signInForm.loginOrEmail' | nzI18n }}</nz-form-label>
    <nz-form-control [nzErrorTip]="'authPage.signInForm.inputValidLoginOrEmail' | nzI18n">
      <input id="sign-in-login" formControlName="login" type="text" autocomplete="username" nz-input />
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-label nzFor="sign-in-password">{{ 'authPage.signInForm.password' | nzI18n }}</nz-form-label>
    <nz-form-control [nzErrorTip]="'authPage.signInForm.inputPassword' | nzI18n">
      <input id="sign-in-password" formControlName="password" type="password" autocomplete="current-password" nz-input />
    </nz-form-control>
  </nz-form-item>

  <button type="submit" class="sa-btn sa-btn--primary sa-btn--lg sa-btn--block sa-form__submit" [disabled]="isSubmitting">
    {{ 'authPage.signInForm.signIn' | nzI18n }}
  </button>
  <p class="sa-form__footer">
    {{ 'auth.newHere' | nzI18n }}
    <a routerLink="/auth/sign-up">{{ 'auth.createAnAccount' | nzI18n }}</a>
  </p>
</form>
