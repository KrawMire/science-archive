<div class="head">
  <h1 class="sa-h1">{{ 'adminNewsPage.news' | nzI18n }}</h1>
  <button type="button" class="sa-btn sa-btn--primary sa-btn--lg" (click)="openCreateNewModal()">
    <sar-icon name="plus" [size]="18" />
    {{ 'admin.newPost' | nzI18n }}
  </button>
</div>

<ng-container *ngIf="(news$ | async) as news">
  <div class="sa-card list" *ngIf="news.length > 0; else emptyList">
    <a class="row" *ngFor="let singleNews of news" [routerLink]="['/content', 'news', singleNews.id]">
      <span class="sa-mono">{{ singleNews.creationDate | dateFormat }}</span>
      <span class="row__body">
        <span class="row__title">{{ singleNews.title }}</span>
        <span class="sa-serif sa-clamp-2">{{ singleNews.body }}</span>
      </span>
    </a>
  </div>
</ng-container>

<ng-template #emptyList>
  <div class="sa-card sa-empty">
    <sar-loading *ngIf="isLoadingNewsList$ | async; else noNews" />
    <ng-template #noNews>
      <p class="sa-empty__title">{{ 'adminNewsPage.noNews' | nzI18n }}</p>
    </ng-template>
  </div>
</ng-template>

<nz-modal
  [(nzVisible)]="showCreateNewModal"
  [nzTitle]="'adminNewsPage.createNewArticle' | nzI18n"
  (nzOnCancel)="closeCreateNewModal()"
  (nzOnOk)="onCreateNews()"
  [nzOkDisabled]="isCreatingNews$ | async"
>
  <ng-container *nzModalContent>
    <form nz-form nzLayout="vertical" [formGroup]="validateForm">
      <nz-form-item>
        <nz-form-control [nzErrorTip]="'adminNewsPage.specifyNewsTitle' | nzI18n">
          <nz-form-label nzRequired>
            {{ 'adminNewsPage.title' | nzI18n }}
          </nz-form-label>
          <nz-input-group>
            <input formControlName="title" type="text" nz-input [placeholder]="'adminNewsPage.newsTitle' | nzI18n" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-control [nzErrorTip]="'adminNewsPage.specifyNewsBody' | nzI18n">
          <nz-form-label nzRequired>
            {{ 'adminNewsPage.body' | nzI18n }}
          </nz-form-label>
          <nz-textarea-count [nzMaxCharacterCount]="2000">
            <textarea
              nz-input
              formControlName="body"
              rows="3"
              [placeholder]="'adminNewsPage.newsBody' | nzI18n"
            ></textarea>
          </nz-textarea-count>
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
