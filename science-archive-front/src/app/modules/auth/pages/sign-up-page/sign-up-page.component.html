<div class="container">
  <div class="left-container">
    <img class="logo" src="assets/images/science-archive.logo.with-text.svg" alt="Logo">
    <div class="goal-text-wrapper">
      <p class="goal-text">
        Our mission is to give to independent scientists and other knowledge
        explorers ability to publish their works and share it across the world.
        It's so expensive to get access to modern science literature in nowadays.
        So is to achieve publishing in any reputable publishing house.
      </p>
    </div>
  </div>
  <div class="right-container">
    <div class="form-wrapper">
      <ng-container *ngIf="(isConfirmation$ | async) as isConfirmation; then confirmForm; else signUpForm" />
      <ng-template #confirmForm>
        <sar-code-confirm-form />
      </ng-template>
      <ng-template #signUpForm>
        <sar-sign-up-form (onSignedUp)="onSignedUp()"/>
      </ng-template>
    </div>
  </div>
</div>
