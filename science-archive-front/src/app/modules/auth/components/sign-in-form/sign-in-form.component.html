<form nz-form class="sign-in-form" [formGroup]="validateForm" (ngSubmit)="submitForm()">
  <h2>Sign in</h2>
  <nz-form-item>
    <nz-form-control nzErrorTip="Please input valid login or email!">
      <nz-input-group nzPrefixIcon="user">
        <input formControlName="login" type="text" nz-input placeholder="Login or email" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-control nzErrorTip="Please input your Password!">
      <nz-input-group nzPrefixIcon="lock">
        <input formControlName="password" type="password" nz-input placeholder="Password" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>
  <button nz-button class="sign-in-form-button" [nzType]="'primary'">
    Log in
  </button>
  <p class="sign-in-suggest-wrapper">
    Don't have an account?
    <a [routerLink]="['/auth', 'sign-up']">
      Sign up
    </a>
  </p>
</form>
