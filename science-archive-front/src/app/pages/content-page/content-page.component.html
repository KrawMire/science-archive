<header>
  <div class="sar-logo-wrapper">
    <a href="/">
      <span>
        <img
          src="assets/images/science-archive.logo.with-text.svg"
          alt="Logo"
          class="sar-logo"
        >
      <title>Science Archive</title>
      </span>
    </a>
  </div>
  <nz-affix nzOffsetTop="0">
    <nav class="sar-top-menu-container">
      <ul
        nz-menu
        nzTheme="light"
        nzMode="horizontal"
      >
        <li
          nz-menu-item
          routerLink="articles"
          nzMatchRouter
        >
          Articles
        </li>
        <li
          nz-menu-item
          routerLink="categories"
          nzMatchRouter
        >
          Categories
        </li>
        <li
          nz-menu-item
          routerLink="news"
          nzMatchRouter
        >
          News
        </li>
      </ul>
      <ng-container *ngIf="(currentUser$ | async) as currentUser; else signIn">
        <div
          (click)="onAccountClick()"
          class="sar-account-button"
        >
          <span>{{currentUser.login}}</span>
        </div>
      </ng-container>
      <ng-template #signIn>
        <div
          [routerLink]="['/auth', 'sign-in']"
          class="sar-account-button"
        >
          <span>Sign in</span>
        </div>
      </ng-template>
    </nav>
  </nz-affix>
</header>

<div class="sar-page-content">
  <router-outlet></router-outlet>
</div>

<nz-drawer
  nzClosable="true"
  nzPlacement="right"
  nzTitle="KrawMire"
  [nzVisible]="(showAccountDrawer$ | async) ?? false"
  (nzOnClose)="onAccountDrawerClose()"
>
  <ng-container *nzDrawerContent>
    <ul
      nz-menu
      nzTheme="light"
      nzMode="vertical"
    >
      <li nz-menu-item>
        <span nz-icon nzType="user" nzTheme="outline"></span>
        My profile
      </li>
      <li nz-menu-item>
        <span nz-icon nzType="book" nzTheme="outline"></span>
        My articles
      </li>
      <li nz-menu-item>
        <span nz-icon nzType="lock" nzTheme="outline"></span>
        Admin panel
      </li>
      <li nz-menu-item>
        <span
          nz-icon
          nzType="warning"
          [nzTheme]="'twotone'"
          [nzTwotoneColor]="'#ff4d4f'"
        ></span>
        <span
          nz-typography
          nzType="danger"
          (click)="onSignOut()"
        >
          Sign out
        </span>
      </li>
    </ul>
  </ng-container>
</nz-drawer>
