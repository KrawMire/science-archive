<form nz-form class="sign-up-form" [formGroup]="validateForm" (ngSubmit)="submitForm()">
  <h2>Sign up</h2>
  <nz-form-item [nzJustify]="'space-between'">
    <nz-form-control nzErrorTip="Name must contain al least 2 letters!">
      <nz-input-group nzPrefixIcon="user">
        <input formControlName="firstName" type="text" nz-input placeholder="First name" />
      </nz-input-group>
    </nz-form-control>
    <nz-form-control nzErrorTip="Name must contain al least 2 letters!">
      <nz-input-group nzPrefixIcon="user">
        <input formControlName="secondName" type="text" nz-input placeholder="Second name" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-control nzErrorTip="Login must contain at least 3 letters!">
      <nz-input-group nzPrefixIcon="login">
        <input formControlName="login" type="text" nz-input placeholder="Login" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-control nzErrorTip="Please input your real email!">
      <nz-input-group nzPrefixIcon="mail">
        <input formControlName="email" type="email" nz-input placeholder="Email" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-control nzErrorTip="Password must contain at least 10 symbols!">
      <nz-input-group nzPrefixIcon="lock">
        <input formControlName="password" type="password" nz-input placeholder="Password" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-control nzErrorTip="Repeated password should be equal to password!">
      <nz-input-group nzPrefixIcon="lock">
        <input formControlName="repeatPassword" type="password" nz-input placeholder="Repeat password" />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>
  <button nz-button class="login-form-button" [nzType]="'primary'">
    Register
  </button>
  <p class="sign-in-suggest-wrapper">
    Already have an account?
    <a [routerLink]="['/auth', 'sign-in']">
      Sign in
    </a>
  </p>
</form>
