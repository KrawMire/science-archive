<div class="sa-page-body">
  <div class="sa-container">
    <div class="head">
      <h1 class="sa-h1">{{ 'header.news' | nzI18n }}</h1>
      <a class="sa-btn sa-btn--secondary" [href]="telegramUrl" target="_blank" rel="noopener noreferrer">
        <sar-icon name="send" [size]="16" />
        {{ 'news.followTelegram' | nzI18n }}
      </a>
    </div>

    <ng-container *ngIf="isLoading$ | async; else newsView">
      <div class="sa-card">
        <sar-news-card-skeleton *ngFor="let _ of [1, 2, 3]" />
      </div>
    </ng-container>

    <ng-template #newsView>
      <ng-container *ngIf="(news$ | async) as news">
        <div class="sa-card sa-empty" *ngIf="news.length === 0">
          <p class="sa-empty__title">{{ 'newsPage.noNews' | nzI18n }}</p>
        </div>

        <article class="sa-panel-navy latest" *ngIf="news[0] as latest">
          <span class="sa-bookmark sa-bookmark--lg latest__bookmark"></span>
          <div class="latest__body">
            <p class="sa-mono latest__date">{{ latest.creationDate | dateFormat }} · {{ 'news.latest' | nzI18n }}</p>
            <h2 class="latest__title">{{ latest.title }}</h2>
            <p class="sa-serif sa-clamp-3 latest__text">{{ latest.body }}</p>
          </div>
          <a class="sa-btn sa-btn--white" [routerLink]="['/content', 'news', latest.id]">{{ 'newsCard.readMore' | nzI18n }}</a>
        </article>

        <div class="sa-card list" *ngIf="news.length > 1">
          <ng-container *ngFor="let singleNews of news; let first = first">
            <sar-news-card *ngIf="!first" [news]="singleNews" />
          </ng-container>
        </div>
      </ng-container>
    </ng-template>
  </div>
</div>
