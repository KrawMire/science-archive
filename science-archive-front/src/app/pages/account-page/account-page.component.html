<sar-site-header />

<main class="sa-page-body account">
  <div class="sa-container account__grid">
    <aside class="sa-card account__side">
      <div class="sa-person account__user" *ngIf="user">
        <span class="sa-avatar sa-avatar--lg">{{ user.name | initials }}</span>
        <div>
          <div class="sa-person__name">{{ user.name }}</div>
          <div class="sa-person__role">{{ user.login }}</div>
        </div>
      </div>
      <nav class="account__nav">
        <a routerLink="profile" routerLinkActive="is-active">
          <sar-icon name="user" [size]="17" /> {{ 'header.profile' | nzI18n }}
        </a>
        <a routerLink="user-articles" routerLinkActive="is-active">
          <sar-icon name="book" [size]="17" /> {{ 'header.myArticles' | nzI18n }}
        </a>
        <a *ngIf="isAdmin" routerLink="/admin">
          <sar-icon name="shield" [size]="17" /> {{ 'header.moderation' | nzI18n }}
        </a>
        <button type="button" class="account__signout" (click)="signOut()">
          <sar-icon name="log-out" [size]="17" /> {{ 'header.signOut' | nzI18n }}
        </button>
      </nav>
    </aside>

    <section class="account__content">
      <router-outlet />
    </section>
  </div>
</main>
